name: build-ios-ipa
# ينتج IPA غير موقّع (lan-war-unsigned.ipa) لتثبيته بـ Sideloadly أو AltStore بحساب Apple ID مجاني.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.3"

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip $BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          curl -fsSL -o tpl.tpz $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip
          unzip -q tpl.tpz -d tpl
          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          mv tpl/templates/* "$DEST/"
          test -f "$DEST/ios.zip"
          echo "IOS_ZIP=$DEST/ios.zip" >> "$GITHUB_ENV"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Fix project settings
        run: |
          python3 - <<'PY'
          import re
          p = "project.godot"
          s = open(p, encoding="utf-8").read()
          key = "textures/vram_compression/import_etc2_astc=true"
          if "import_etc2_astc" in s:
              s = re.sub(r"textures/vram_compression/import_etc2_astc=.*", key, s)
          elif "[rendering]" in s:
              s = s.replace("[rendering]\n", "[rendering]\n\n" + key + "\n", 1)
          else:
              s += "\n[rendering]\n\n" + key + "\n"
          open(p, "w", encoding="utf-8").write(s)
          PY
          grep -n -E "etc2_astc|rendering_method|run/main_scene" project.godot || true

      - name: Create app icon PNG
        run: |
          mkdir -p build
          if [ -f icon.svg ]; then
            qlmanage -t -s 1024 -o /tmp icon.svg >/dev/null 2>&1 || true
            [ -f /tmp/icon.svg.png ] && cp /tmp/icon.svg.png app_icon.png
          fi
          if [ ! -s app_icon.png ]; then
            echo "Fallback: generating icon with Python"
            python3 - <<'PY'
          import zlib, struct
          W = H = 1024
          row = b"\x00" + bytes([40, 70, 40, 255]) * W
          raw = row * H
          def chunk(t, d):
              c = struct.pack(">I", len(d)) + t + d
              return c + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", W, H, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
          open("app_icon.png", "wb").write(png)
          PY
          fi
          ls -la app_icon.png

      - name: Fix export preset
        run: |
          sed -i '' "s|custom_template/debug=\".*\"|custom_template/debug=\"$IOS_ZIP\"|" export_presets.cfg
          sed -i '' "s|custom_template/release=\".*\"|custom_template/release=\"$IOS_ZIP\"|" export_presets.cfg
          sed -i '' 's|__TEAM_ID__|AAAAAAAAAA|g; s|__PROFILE_UUID__||g' export_presets.cfg
          sed -i '' 's|application/export_project_only=.*|application/export_project_only=true|' export_presets.cfg
          sed -i '' -E 's|^(icons/[a-z_]+[0-9]+x[0-9]+)=""|\1="res://app_icon.png"|' export_presets.cfg
          grep -E "custom_template|bundle_identifier|export_path|export_project_only|team_id" export_presets.cfg
          grep -E "^icons/" export_presets.cfg | head -20

      - name: Import Godot assets
        run: |
          "$GODOT" --headless --verbose --editor --quit || true

      - name: Export Xcode project from Godot
        run: |
          rm -rf build/ios
          mkdir -p build/ios
          set +e
          "$GODOT" --headless --verbose --export-debug "iOS" build/ios/lan-war.xcodeproj > export.log 2>&1
          CODE=$?
          set -e
          echo "=========== ERRORS ==========="
          grep -n -i -E "error|invalid|missing|not found" export.log | fold -w 80 || true
          echo "=============================="
          if ! find build/ios -maxdepth 2 -name "*.xcodeproj" | grep -q .; then
            echo "Export failed (exit code $CODE)"
            exit 1
          fi
          ls -la build/ios

      - name: Repair empty JSON files
        run: |
          cd build/ios
          find . -name "*.json" -not -path "./out/*" | while read f; do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>/dev/null; then
              echo "BAD: $f -> repaired"
              printf '{\n  "info" : {\n    "author" : "xcode",\n    "version" : 1\n  }\n}\n' > "$f"
            fi
          done

      - name: Build unsigned IPA with Xcode
        run: |
          cd build/ios
          PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" -not -path "./out/*" | head -n 1)
          NAME=$(basename "$PROJ" .xcodeproj)
          echo "Project: $PROJ  Name: $NAME"
          set +e
          xcodebuild -project "$PROJ" -scheme "$NAME" -sdk iphoneos -configuration Debug \
            -derivedDataPath out \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > ../xcodebuild.log 2>&1
          CODE=$?
          set -e
          grep -n -i -E "error:|damaged|reason" ../xcodebuild.log | fold -w 80 | head -30 || true
          [ $CODE -eq 0 ] || exit $CODE
          APP=$(find out/Build/Products/Debug-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr lan-war-unsigned.ipa Payload
          unzip -l lan-war-unsigned.ipa | grep -i "\.pck" || (echo "NO PCK IN IPA" && exit 1)

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            build/xcodebuild.log
            export.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lan-war-ios-unsigned
          path: build/ios/lan-war-unsigned.ipa
