name: build-android-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot templates and editor settings
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/. ~/.local/share/godot/export_templates/
          cp -r /root/.config/godot/. ~/.config/godot/ || true

      - name: Install Android SDK (build-tools 34) and point Godot to it
        run: |
          apt-get update -qq && apt-get install -y -qq unzip curl zip
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          JAVA_DIR=$(dirname "$(dirname "$(readlink -f "$(which keytool)")")")
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" "$JAVA_DIR" > ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-4.tres

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK (debug-signed)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/lan-war.apk
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: lan-war-apk
          path: build/android/lan-war.apk
